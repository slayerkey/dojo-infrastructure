name: Activation v39 check

on:
  push:
    branches:
      - feat/activation-audit-phase1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-v39:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slayerkey-dojo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run activation tests
        run: node --test tests/activation-v39.test.mjs

      - name: Syntax check activation files
        run: |
          node --check src/activation-core.js
          node --check src/activation-backfill.js
          node --check src/activation-audit.js
          node --check src/index-v39.js

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
