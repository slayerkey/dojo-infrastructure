name: Activation v39 validation

on:
  push:
    branches:
      - feat/activation-audit-phase1
    paths:
      - "slayerkey-dojo/**"
      - ".github/workflows/activation-v39-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activation-v39-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: slayerkey-dojo

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Show runtime
        run: |
          node --version
          npm --version
          git rev-parse --short HEAD

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Syntax checks
        run: |
          node --check src/activation-core.js
          node --check src/activation-backfill.js
          node --check src/activation-audit.js
          node --check src/index-v39.js

      - name: Activation tests
        run: npm test

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
