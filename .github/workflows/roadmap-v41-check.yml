name: Roadmap v41 validation

on:
  push:
    branches:
      - feat/roadmap-v41
    paths:
      - "slayerkey-dojo/**"
      - ".github/workflows/roadmap-v41-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-v41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slayerkey-dojo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run check:v41
