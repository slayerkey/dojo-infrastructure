name: Verify Dojo Payment Proof Runtime
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  payment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe live identity bridge payment verification
        shell: bash
        run: |
          set -euo pipefail
          body='{"whop_user_id":"user_runtime_probe","posthog_distinct_id":"runtime_probe","payment_id":"pay_AAAAAAAAAAAAAA"}'
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 15 -o "$response_file" -w '%{http_code}'             -X POST 'https://slayerkey-dojo.mystd.workers.dev/internal/customer-identity'             -H 'Content-Type: application/json'             --data "$body")"
          response="$(cat "$response_file")"
          echo "HTTP $status"
          echo "$response"
          if [[ "$status" != "502" ]]; then
            echo "Expected the live Worker to attempt Whop payment verification and fail safely with 502 for a fake payment."
            exit 1
          fi
          if [[ "$response" != *"Whop payment verification"* ]]; then
            echo "Live Worker did not return the payment-proof verification path."
            exit 1
          fi
