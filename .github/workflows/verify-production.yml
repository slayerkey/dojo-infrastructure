name: Verify Dojo Production Runtime
on:
  push:
    branches: [main]
    paths:
      - 'slayerkey-dojo/**'
      - '.github/workflows/verify-production.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify production Worker health
        shell: bash
        env:
          HEALTH_URL: https://slayerkey-dojo.mystd.workers.dev/health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$HEALTH_URL")"
          echo "$body"
          HEALTH_JSON="$body" node -e 'const body=JSON.parse(process.env.HEALTH_JSON||"{}"); const roadmap=body?.discord?.roadmap?.version; const journey=body?.discord?.customer_journey||{}; console.log(JSON.stringify({roadmap_version:roadmap||null,customer_journey_version:journey.version||null,posthog_configured:journey.posthog_configured===true,identity_bridge_configured:journey.identity_bridge_configured===true,delivery:journey.delivery||null})); if(roadmap!=="v41"||journey.version!=="posthog-v1"||journey.posthog_configured!==true||journey.identity_bridge_configured!==true) process.exit(1);'
