name: Verify Dojo Production Runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe live production Worker
        shell: bash
        env:
          HEALTH_URL: https://slayerkey-dojo.mystd.workers.dev/health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$HEALTH_URL")"
          echo "$body"
          HEALTH_JSON="$body" node -e '
            const body=JSON.parse(process.env.HEALTH_JSON||"{}");
            const j=body?.discord?.customer_journey||{};
            const r=body?.discord?.roadmap||{};
            const result={
              journey_version:j.version||null,
              posthog_configured:j.posthog_configured===true,
              identity_bridge_configured:j.identity_bridge_configured===true,
              has_community_participated:Array.isArray(j.events)&&j.events.includes("community_participated"),
              roadmap_version:r.version||null,
              roadmap_has_visibility:Array.isArray(r.commands)&&r.commands.includes("/roadmap-visibility"),
              progress_visibility:r.progress_visibility||null
            };
            console.log(JSON.stringify(result));
            if(!result.has_community_participated || !result.roadmap_has_visibility) process.exit(2);
          '
